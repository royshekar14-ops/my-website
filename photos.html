<!DOCTYPE html>
<html>
<head>
    <title>My Photos</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #0f172a;
            color: white;
            margin: 0;
        }

        nav {
            background: #1e293b;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-size: 18px;
        }

        nav a:hover {
            color: #60a5fa;
        }

        .content {
            padding: 50px 20px;
        }

        h1 {
            font-size: 40px;
        }

        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .gallery img {
            width: 250px;
            max-width: 90%;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
        }

        .gallery img:hover {
            transform: scale(1.05);
        }

        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .lightbox img {
            max-width: 90%;
            max-height: 85%;
            border-radius: 10px;
        }

        .close {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 40px;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>

    <div class="content">

        <h1>📸 My Photos</h1>

        <div class="gallery">

            <img src="IMG_20260814_160301.png"
                 alt="Photo 1"
                 onclick="openPhoto(this.src)">

            <img src="Screenshot_20260819-223305.png"
                 alt="Photo 2"
                 onclick="openPhoto(this.src)">

            <img src="2f43d70045b53956e22b1acb06534954.webp"
                 alt="Photo 3"
                 onclick="openPhoto(this.src)">

        </div>

    </div>

    <div class="lightbox" id="lightbox" onclick="closePhoto()">

        <span class="close">&times;</span>

        <img id="bigPhoto" src="" alt="Big Photo">

    </div>

    <script>
        function openPhoto(image) {
            document.getElementById("lightbox").style.display = "flex";
            document.getElementById("bigPhoto").src = image;
        }

        function closePhoto() {
            document.getElementById("lightbox").style.display = "none";
        }
    </script>

</body>
</html>
