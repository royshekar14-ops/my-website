<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Legendary Collection</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            min-height: 100vh;

            background: #000;

            color: white;

            font-family: Arial, sans-serif;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;

            padding: 20px;
        }

        h1 {
            font-size: 38px;

            margin-bottom: 25px;

            letter-spacing: 2px;

            text-shadow:
                0 0 10px rgba(255,255,255,0.5),
                0 0 30px rgba(255,180,50,0.4);
        }

        /* VIDEO */

        video {
            width: 90%;

            max-width: 900px;

            max-height: 75vh;

            border-radius: 15px;

            box-shadow:
                0 0 30px rgba(255,212,59,0.5);
        }

        /* BACK BUTTON */

        .back-button {

            margin-top: 25px;

            padding: 13px 28px;

            border: 1px solid #ffd43b;

            border-radius: 30px;

            background: transparent;

            color: #ffd43b;

            font-size: 16px;

            cursor: pointer;

            text-decoration: none;

            transition: 0.3s;
        }

        .back-button:hover {

            background: #ffd43b;

            color: #000;

            box-shadow:
                0 0 25px rgba(255,212,59,0.8);
        }

        /* MOBILE */

        @media (max-width: 600px) {

            h1 {
                font-size: 27px;
            }

            video {
                width: 100%;
            }

            .back-button {
                font-size: 14px;

                padding: 12px 23px;
            }
        }

    </style>

</head>


<body>

    <h1>
        My Legendary Collection
    </h1>


    <!-- YOUR VIDEO -->

    <video
        controls
        playsinline
        preload="metadata">

        <source
            src="525099_gif_480.mp4"
            type="video/mp4">

        Your browser does not support video.

    </video>


    <!-- BACK BUTTON -->

    <a
        class="back-button"
        href="index.html">

        ← Back

    </a>


</body>

</html>
