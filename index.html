
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Periodic Table</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: radial-gradient(circle at center, #172b3e, #080d18 80%);
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
    text-align: center;
}

h1 {
    margin: 18px 0 5px;
    font-size: 27px;
    letter-spacing: 3px;
    color: #00eaff;
    text-shadow: 0 0 12px #00eaff;
}

.subtitle {
    color: #8299aa;
    font-size: 10px;
    letter-spacing: 3px;
    margin-bottom: 15px;
}

.buttons {
    position: relative;
    z-index: 10;
}

button {
    padding: 9px 14px;
    margin: 3px;
    border: 1px solid #00eaff66;
    border-radius: 20px;
    background: #142638;
    color: white;
    cursor: pointer;
}

button.active {
    background: #00eaff;
    color: #06111b;
    box-shadow: 0 0 10px #00eaff;
}

.scene {
    width: 100%;
    height: 70vh;
    perspective: 1100px;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    touch-action: pan-y;
}

.world {
    position: relative;
    width: 1px;
    height: 1px;
    transform-style: preserve-3d;
    will-change: transform;
}

.element {
    position: absolute;
    width: 42px;
    height: 48px;
    border: 1px solid currentColor;
    border-radius: 8px;
    background: rgba(10,30,50,0.9);

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    transform-style: preserve-3d;
    will-change: transform;

    box-shadow:
        0 0 4px currentColor,
        inset 0 0 5px currentColor;

    transition:
        background 0.2s,
        box-shadow 0.2s;

    cursor: pointer;
}

.element::before {
    content: "";
    position: absolute;
    inset: 3px;
    border: 1px solid currentColor;
    border-radius: 5px;
    opacity: 0.3;
    pointer-events: none;
}

.element:hover {
    background: #263d60;
    box-shadow: 0 0 12px currentColor;
    z-index: 100;
}

.symbol {
    font-size: 16px;
    font-weight: bold;
}

.name {
    font-size: 6px;
    margin-top: 2px;
}

.number {
    font-size: 7px;
    opacity: 0.8;
}

/* Original colors */

.element:nth-child(4n) {
    color: #ff6464;
}

.element:nth-child(4n+1) {
    color: #ffd166;
}

.element:nth-child(4n+2) {
    color: #06d6a0;
}

.element:nth-child(4n+3) {
    color: #4cc9f0;
}

/* Details */

.overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.details {
    width: 310px;
    max-width: 100%;
    padding: 25px;
    border: 1px solid #00eaff;
    border-radius: 18px;
    background: linear-gradient(145deg,#19344b,#071321);
    box-shadow: 0 0 25px #00eaff55;
    text-align: left;
    animation: popup 0.3s ease;
}

@keyframes popup {
    from {
        transform: scale(0.7);
        opacity: 0;
    }
    to {
        transform: scale(1);
        opacity: 1;
    }
}

.details h2 {
    color: #00eaff;
    text-align: center;
}

.details p {
    line-height: 1.8;
    font-size: 14px;
}

.close {
    display: block;
    margin: 15px auto 0;
    background: #00eaff;
    color: black;
}

.hint {
    color: #8299aa;
    font-size: 10px;
    letter-spacing: 1px;
}
</style>
</head>

<body>

<h1>PERIODIC TABLE</h1>
<div class="subtitle">INTERACTIVE 3D ELEMENTS</div>

<div class="buttons">
    <button class="active" onclick="changeMode('table',this)">Table</button>
    <button onclick="changeMode('sphere',this)">Sphere</button>
    <button onclick="changeMode('helix',this)">Helix</button>
    <button onclick="changeMode('grid',this)">Grid</button>
</div>

<div class="scene" id="scene">
    <div class="world" id="world"></div>
</div>

<p class="hint">MOVE YOUR MOUSE OR TOUCH TO CONTROL 3D</p>

<div class="overlay" id="overlay">
    <div class="details">
        <h2 id="detailSymbol"></h2>
        <p id="detailInfo"></p>
        <button class="close" onclick="closeDetails()">CLOSE</button>
    </div>
</div>

const world = document.getElementById("world");
const scene = document.getElementById("scene");

let cards = [];

data.forEach(element => {

    const card = document.createElement("div");

    card.className = "element";

    card.innerHTML = `
        <div class="number">${element[2]}</div>
        <div class="symbol">${element[0]}</div>
        <div class="name">${element[1]}</div>
    `;

    card.addEventListener("click", () => {
        showDetails(element);
    });

    world.appendChild(card);
    cards.push(card);

});

function changeMode(mode,button) {

    document.querySelectorAll(".buttons button")
    .forEach(b => b.classList.remove("active"));

    button.classList.add("active");

    const total = cards.length;

    cards.forEach((card,i) => {

        let x,y,z;

        if(mode === "table") {

            let col = i % 18;
            let row = Math.floor(i / 18);

            x = (col-8.5)*49;
            y = (row-3)*55;
            z = 0;

        }

        else if(mode === "sphere") {

            let phi = Math.acos(1-2*(i+0.5)/total);
            let theta = Math.PI*(1+Math.sqrt(5))*i;

            let r = 145;

            x = r*Math.sin(phi)*Math.cos(theta);
            y = r*Math.sin(phi)*Math.sin(theta);
            z = r*Math.cos(phi);

        }

        else if(mode === "helix") {

            let angle = i*0.42;
            let r = 105;

            x = r*Math.cos(angle);
            y = (i-total/2)*7;
            z = r*Math.sin(angle);

        }

        else if(mode === "grid") {

            let col = i%9;
            let row = Math.floor(i/9);

            x = (col-4)*52;
            y = (row-6)*52;
            z = (i%3)*35;

        }

        card.style.transform =
        `translate3d(${x}px,${y}px,${z}px)`;

    });

}

// Smooth mouse and touch control

let targetX = 0;
let targetY = 0;

let rotateX = 0;
let rotateY = 0;

scene.addEventListener("pointermove", event => {

    const rect = scene.getBoundingClientRect();

    const x = (event.clientX - rect.left) / rect.width;
    const y = (event.clientY - rect.top) / rect.height;

    targetY = (x - 0.5) * 70;
    targetX = (0.5 - y) * 60;

});

scene.addEventListener("pointerleave", () => {
    targetX = 0;
    targetY = 0;
});

function animate() {

    rotateX += (targetX - rotateX) * 0.12;
    rotateY += (targetY - rotateY) * 0.12;

    world.style.transform =
        `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;

    requestAnimationFrame(animate);

}

// Details

function showDetails(element) {

    document.getElementById("detailSymbol").innerText =
        element[0] + " - " + element[1];

    document.getElementById("detailInfo").innerHTML = `
        <b>Atomic Number:</b> ${element[2]}<br>
        <b>Name:</b> ${element[1]}<br>
        <b>Symbol:</b> ${element[0]}<br>
        <b>Atomic Mass:</b> ${element[3]} u<br>
        <b>Uses:</b> ${element[4]}
    `;

    document.getElementById("overlay").style.display = "flex";
}

function closeDetails() {
    document.getElementById("overlay").style.display = "none";
}

// Start

changeMode("table",document.querySelector(".buttons button"));
animate();
