<style>

/* =========================
   BASIC RESET
========================= */

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f2f4f7;
}


/* =========================
   TOP BAR
========================= */

.topbar{
    height:60px;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    z-index:1000;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.menu-button{
    width:45px;
    height:45px;
    border:none;
    background:#f1f1f1;
    border-radius:12px;
    font-size:25px;
    cursor:pointer;
}

.site-name{
    font-size:20px;
    font-weight:bold;
    color:#6c4cff;
}

.account{
    width:45px;
    height:45px;
    border-radius:50%;
    background:#6c4cff;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
}


/* =========================
   ACCOUNT BOX
========================= */

.account-box{
    position:fixed;
    top:70px;
    right:15px;
    width:260px;
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.2);
    display:none;
    z-index:3000;
}

.account-box.active{
    display:block;
}

.account-box h3{
    margin-top:0;
    text-align:center;
}

.account-box input{
    width:100%;
    padding:11px;
    margin-bottom:10px;
    border:1px solid #ddd;
    border-radius:8px;
    outline:none;
}

.login-button,
.signup-button,
.logout-button{
    width:100%;
    padding:11px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    margin-top:6px;
}

.login-button{
    background:#6c4cff;
    color:white;
}

.signup-button{
    background:#eee;
    color:#333;
}

.logout-button{
    background:#ff4d4d;
    color:white;
    display:none;
}

.login-button:hover{
    background:#5739e8;
}

.signup-button:hover{
    background:#ddd;
}

.logout-button:hover{
    background:#dd3333;
}


/* =========================
   LOGIN STATUS
========================= */

.login-status{
    font-size:14px;
    text-align:center;
    margin:10px 0;
    color:#555;
    word-break:break-word;
}

.logged-in{
    color:green;
    font-weight:bold;
}

.logged-out{
    color:#777;
}


/* =========================
   SIDE MENU
========================= */

.side-menu{
    position:fixed;
    top:0;
    left:-280px;
    width:280px;
    height:100%;
    background:white;
    z-index:2000;
    box-shadow:5px 0 20px rgba(0,0,0,.2);
    transition:.3s;
    padding-top:75px;
}

.side-menu.active{
    left:0;
}

.menu-title{
    padding:15px 20px;
    font-size:22px;
    font-weight:bold;
}

.menu-item{
    display:block;
    margin:5px 12px;
    padding:15px 18px;
    text-decoration:none;
    color:#222;
    font-size:18px;
    border-radius:12px;
}

.menu-item:hover{
    background:#f1efff;
    color:#6c4cff;
}

.close-btn{
    position:absolute;
    top:15px;
    right:15px;
    border:none;
    background:#eee;
    width:40px;
    height:40px;
    border-radius:50%;
    font-size:20px;
    cursor:pointer;
}

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    z-index:1500;
    display:none;
}

.overlay.active{
    display:block;
}


/* =========================
   MAIN
========================= */

main{
    padding:85px 15px 30px;
    max-width:900px;
    margin:auto;
}


/* =========================
   HERO
========================= */

.hero{
    background:linear-gradient(135deg,#6c4cff,#9c7cff);
    color:white;
    border-radius:25px;
    padding:45px 25px;
    text-align:center;

}

.hero h1{

    font-size:32px;
}

.hero p{

    font-size:17px;

/* =========================
   SECTION
========================= */

.section-title{

    font-size:25px;

/* =========================
   VIDEO FEED
========================= */

.video-feed{

/* =========================
   FULL VIDEO
========================= */

.video-card{
    background:white;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 4px 12px rgba(0,0,0,.15);
}

.video-card video{
    width:100%;
    display:block;
    background:#000;
    max-height:500px;
}

.video-card iframe{
    width:100%;
    height:500px;
    display:block;
    border:0;
    background:#000;
}


/* =========================
   SHORT SECTION
========================= */

.short-section{
    background:#111;
    border-radius:18px;
    padding:10px;
    overflow:hidden;
}

.short-heading{
    color:white;
    font-size:18px;
    font-weight:bold;
    margin-bottom:10px;
}


/* =========================
   SHORT ROW
========================= */

.tiktok-line{
    display:flex;
    gap:12px;
    overflow-x:auto;
    scrollbar-width:none;
}

.tiktok-line::-webkit-scrollbar{
    display:none;
}


/* =========================
   SHORT CARD
========================= */

.tiktok-card{
    min-width:145px;
    width:145px;
    height:210px;
    background:#000;
    border-radius:15px;
    overflow:hidden;
    flex-shrink:0;
    cursor:pointer;
}

.tiktok-card video{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    pointer-events:none;
}

.tiktok-card iframe{
    width:100%;
    height:100%;
    border:0;
    pointer-events:none;
}


/* =========================
   SHORT VIEWER
========================= */

.short-viewer{
    position:fixed;
    inset:0;
    background:#000;
    z-index:5000;
    display:none;
}

.short-viewer.active{
    display:block;
}


/* =========================
   CLOSE BUTTON
========================= */

.short-close{
    position:fixed;
    top:15px;
    right:15px;
    z-index:7000;
    width:44px;
    height:44px;
    border:none;
    border-radius:50%;
    background:rgba(0,0,0,.55);
    color:white;
    font-size:22px;
    cursor:pointer;
}


/* =========================
   LIKE BUTTON
========================= */

.short-like{
    position:fixed;
    top:58%;
    right:15px;
    z-index:7000;
    border:none;
    border-radius:25px;
    padding:11px 17px;

    color:#222;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.short-like.liked{

/* =========================
   SHORT FEED
========================= */

.short-feed{
    width:100%;
    height:100%;
    overflow-y:auto;
    overflow-x:hidden;
    scroll-snap-type:y mandatory;
    -webkit-overflow-scrolling:touch;
}

.short-item{
    width:100%;
    height:100vh;
    min-height:100vh;
    background:#000;

    display:flex;
    align-items:center;
    justify-content:center;

.short-item iframe{

/* =========================

========================= */

.posts{

        right:12px;

/* =====================================================
   SIGN UP
===================================================== */

signupButton.onclick =
async function(){

    const email =
        emailInput.value.trim();

    const password =
        passwordInput.value;


    if(!email || !password){

        alert(
            "Email এবং Password দিন।"
        );

        return;

    }


    if(password.length < 6){

        alert(
            "Password কমপক্ষে 6 characters হতে হবে।"
        );

        return;

    }


    try{

        await createUserWithEmailAndPassword(
            auth,
            email,
            password
        );


        alert(
            "Sign Up সফল হয়েছে! 🎉"
        );


        passwordInput.value = "";


    }catch(error){

        console.error(error);


        if(
            error.code ===
            "auth/email-already-in-use"
        ){

            alert(
                "এই Email দিয়ে আগে থেকেই Account আছে।"
            );

        }else if(
            error.code ===
            "auth/invalid-email"
        ){

            alert(
                "Email ঠিকভাবে লিখুন।"
            );

        }else if(
            error.code ===
            "auth/weak-password"
        ){

            alert(
                "Password আরও শক্ত করুন।"
            );

        }else{

            alert(
                "Sign Up হয়নি: " +
                error.message
            );

        }

    }

};


/* =====================================================
   LOGIN
===================================================== */

loginButton.onclick =
async function(){

    const email =

    const password =
        passwordInput.value;


    if(!email || !password){

        alert(
            "Email এবং Password দিন।"

    }


    try{

                "Email অথবা Password ভুল।"

            );

        }else{

            alert(

                error.message
            );

    }

};


/* =====================================================

/* =====================================================
   RANDOM FUNCTION
===================================================== */

function shuffle(array){

    for(
        let i=array.length-1;
        i>0;
        i--
    ){

        const j =
            Math.floor(
                Math.random()*(i+1)
            );


        [
            array[i],
            array[j]
        ] =
        [
            array[j],
            array[i]
        ];

    }

    return array;

}

        `;

    }


    if(
        video.type === "jumpshare"
    ){

        card.innerHTML = `

            <iframe
                src="${video.src}"
                allow="autoplay; fullscreen; picture-in-picture"
                allowfullscreen>
            </iframe>

        `;

    }


    return card;

}


/* =====================================================
   CREATE SHORT ROW
===================================================== */

function createShortRow(){

    const section =
        document.createElement(
            "div"
        );


    section.className =
        "short-section";


    const heading =
        document.createElement(
            "div"
        );


    heading.className =
        "short-heading";


    heading.innerHTML =
        "👉 🎵 Short Videos";


    section.appendChild(
        heading
    );


    const line =
        document.createElement(
            "div"
        );


    line.className =
        "tiktok-line";


    const rowShorts =
        shuffle(
            [...shortVideos]
        );


    rowShorts.forEach(
        function(video){

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "tiktok-card";


            if(
                video.type === "file"
            ){

                card.innerHTML = `

                    <video
                        src="${video.src}"
                        muted
                        autoplay
                        playsinline
                        loop
                        preload="metadata">
                    </video>

                `;

            }


            if(
                video.type === "jumpshare"
            ){

                card.innerHTML = `

                    <iframe
                        src="${video.src}"
                        allow="autoplay; fullscreen; picture-in-picture"
                        allowfullscreen>
                    </iframe>

                `;

            }


            card.onclick =
                function(){

                    openShortViewer(
                        video
                    );

                };


            line.appendChild(
                card
            );

        }
    );


    section.appendChild(
        line
    );


    return section;

}


/* =====================================================
   BUILD FEED
===================================================== */

randomFull.forEach(
    function(video,index){

        feed.appendChild(
            createFullVideo(
                video
            )
        );


        if(
            (index + 1) % 4 === 0
        ){

            feed.appendChild(
                createShortRow()
            );

        }

    }
);


/* =====================================================
   SHORT VIEWER
===================================================== */

const shortViewer =
    document.getElementById(
        "shortViewer"
    );


const shortFeed =
    document.getElementById(
        "shortFeed"
    );


const shortClose =
    document.getElementById(
        "shortClose"
    );


const shortLike =
    document.getElementById(
        "shortLike"
    );


let currentVideos = [];


let loadingMore = false;


/* =====================================================
   OPEN SHORT
===================================================== */

function openShortViewer(
    clickedVideo
){

    shortFeed.innerHTML =
        "";


    const others =
        shortVideos.filter(
            function(video){

                return video.src !==
                    clickedVideo.src;

            }
        );


    shuffle(others);


    currentVideos = [

        clickedVideo,

        ...others

    ];


    createViewerVideos();


    shortViewer.classList.add(
        "active"
    );


    document.body.style.overflow =
        "hidden";


    shortLike.classList.remove(
        "liked"
    );


    shortLike.innerHTML =
        "🤍 Like";


    setTimeout(
        function(){

            playVisibleVideo();

        },
        200
    );

}


/* =====================================================
   CREATE VIEWER VIDEOS
===================================================== */

function createViewerVideos(){

    shortFeed.innerHTML =
        "";


    currentVideos.forEach(
        function(video){

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "short-item";


            if(
                video.type === "file"
            ){

                item.innerHTML = `

                    <video
                        src="${video.src}"
                        autoplay
                        muted
                        loop
                        playsinline
                        preload="auto">
                    </video>

                `;

            }


            if(
                video.type === "jumpshare"
            ){

                item.innerHTML = `

                    <iframe
                        src="${video.src}"
                        allow="autoplay; fullscreen; picture-in-picture"
                        allowfullscreen>
                    </iframe>

                `;

            }


            shortFeed.appendChild(
                item
            );

        }
    );

}


/* =====================================================
   PLAY VISIBLE VIDEO
===================================================== */

function playVisibleVideo(){

    const items =
        shortFeed.querySelectorAll(
            ".short-item"
        );


    let bestItem = null;


    let bestVisibility = 0;


    items.forEach(
        function(item){

            const rect =
                item.getBoundingClientRect();


            const visibleTop =
                Math.max(
                    rect.top,
                    0
                );


            const visibleBottom =
                Math.min(
                    rect.bottom,
                    window.innerHeight
                );


            const visible =
                Math.max(
                    0,
                    visibleBottom -
                    visibleTop
                );


            if(
                visible >
                bestVisibility
            ){

                bestVisibility =
                    visible;

                bestItem =
                    item;

            }

        }
    );


    items.forEach(
        function(item){

            const video =
                item.querySelector(
                    "video"
                );


            if(!video){

                return;

            }


            if(
                item === bestItem
            ){

                video.play().catch(
                    function(){}
                );

            }else{

                video.pause();

            }

        }
    );

}


/* =====================================================
   SHORT SCROLL
===================================================== */

let scrollTimer;


shortFeed.addEventListener(
    "scroll",
    function(){

        clearTimeout(
            scrollTimer
        );


        scrollTimer =
            setTimeout(
                function(){

                    playVisibleVideo();


                    if(
                        shortFeed.scrollTop +
                        shortFeed.clientHeight >=
                        shortFeed.scrollHeight - 500
                    ){

                        if(
                            !loadingMore
                        ){

                            addMoreRandomShorts();

                        }

                    }

                },
                80
            );

    }
);


/* =====================================================
   ADD MORE RANDOM SHORTS
===================================================== */

function addMoreRandomShorts(){

    loadingMore = true;


    const more =
        shuffle(
            [...shortVideos]
        );


    more.forEach(
        function(video){

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "short-item";


            if(
                video.type === "file"
            ){

                item.innerHTML = `

                    <video
                        src="${video.src}"
                        muted
                        loop
                        playsinline
                        preload="auto">
                    </video>

                `;

            }


            if(
                video.type === "jumpshare"
            ){

                item.innerHTML = `

                    <iframe
                        src="${video.src}"
                        allow="autoplay; fullscreen; picture-in-picture"
                        allowfullscreen>
                    </iframe>

                `;

            }


            shortFeed.appendChild(
                item
            );

        }
    );


    setTimeout(
        function(){

            loadingMore = false;

        },
        500
    );

}


/* =====================================================
   LIKE
===================================================== */

shortLike.onclick =
    function(event){

        event.stopPropagation();


        shortLike.classList.toggle(
            "liked"
        );


        if(
            shortLike.classList.contains(
                "liked"
            )
        ){

            shortLike.innerHTML =
                "❤️ Liked";

        }else{

            shortLike.innerHTML =
                "🤍 Like";

        }

    };


/* =====================================================
   CLOSE SHORT
===================================================== */

function closeShortViewer(){

    shortViewer.classList.remove(
        "active"
    );


    document.body.style.overflow =
        "";


    shortFeed
        .querySelectorAll("video")
        .forEach(
            function(video){

                video.pause();

            }
        );


    shortFeed.innerHTML =
        "";

}


shortClose.onclick =
    function(){

        closeShortViewer();

    };


/* =====================================================
   ESC KEY
===================================================== */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Escape"
        ){

            if(
                shortViewer.classList
                .contains("active")
            ){

                closeShortViewer();

            }

        }

    }
);


</script>
