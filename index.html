<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Video Site</title>

<style>

/* =========================
   BASIC RESET
========================= */

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f2f4f7;
}


/* =========================
   TOP BAR
========================= */

.topbar{
    height:60px;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    z-index:1000;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.menu-button{
    width:45px;
    height:45px;
    border:none;
    background:#f1f1f1;
    border-radius:12px;
    font-size:25px;
    cursor:pointer;
}

.site-name{
    font-size:20px;
    font-weight:bold;
    color:#6c4cff;
}

.account{
    width:45px;
    height:45px;
    border-radius:50%;
    background:#6c4cff;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
}


/* =========================
   ACCOUNT BOX
========================= */

.account-box{
    position:fixed;
    top:70px;
    right:15px;
    width:220px;
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.2);
    display:none;
    z-index:3000;
}

.account-box.active{
    display:block;
}

.account-box h3{
    margin-top:0;
    text-align:center;
}

.account-box input{
    width:100%;
    padding:11px;
    margin-bottom:10px;
    border:1px solid #ddd;
    border-radius:8px;
    outline:none;
}

.login-button,
.signup-button{
    width:100%;
    padding:11px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    margin-top:5px;
}

.login-button{
    background:#6c4cff;
    color:white;
}

.signup-button{
    background:#eee;
}


/* =========================
   SIDE MENU
========================= */

.side-menu{
    position:fixed;
    top:0;
    left:-280px;
    width:280px;
    height:100%;
    background:white;
    z-index:2000;
    box-shadow:5px 0 20px rgba(0,0,0,.2);
    transition:.3s;
    padding-top:75px;
}

.side-menu.active{
    left:0;
}

.menu-title{
    padding:15px 20px;
    font-size:22px;
    font-weight:bold;
}

.menu-item{
    display:block;
    margin:5px 12px;
    padding:15px 18px;
    text-decoration:none;
    color:#222;
    font-size:18px;
    border-radius:12px;
}

.menu-item:hover{
    background:#f1efff;
    color:#6c4cff;
}

.close-btn{
    position:absolute;
    top:15px;
    right:15px;
    border:none;
    background:#eee;
    width:40px;
    height:40px;
    border-radius:50%;
    font-size:20px;
    cursor:pointer;
}

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    z-index:1500;
    display:none;
}

.overlay.active{
    display:block;
}


/* =========================
   MAIN
========================= */

main{
    padding:85px 15px 30px;
    max-width:900px;
    margin:auto;
}


/* =========================
   HERO
========================= */

.hero{
    background:linear-gradient(135deg,#6c4cff,#9c7cff);
    color:white;
    border-radius:25px;
    padding:45px 25px;
    text-align:center;
    box-shadow:0 8px 20px rgba(0,0,0,.15);
}

.hero h1{
    margin:0 0 10px;
    font-size:32px;
}

.hero p{
    margin:0;
    font-size:17px;
}


/* =========================
   SECTION
========================= */

.section-title{
    margin-top:30px;
    font-size:25px;
}


/* =========================
   VIDEO FEED
========================= */

.video-feed{
    display:flex;
    flex-direction:column;
    gap:15px;
}


/* =========================
   FULL VIDEO
========================= */

.video-card{
    background:white;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 4px 12px rgba(0,0,0,.15);
}

.video-card video{
    width:100%;
    display:block;
    background:#000;
    max-height:500px;
}

.video-card iframe{
    width:100%;
    height:500px;
    display:block;
    border:0;
    background:#000;
}


/* =========================
   SHORT SECTION
========================= */

.short-section{
    background:#111;
    border-radius:18px;
    padding:10px;
    overflow:hidden;
}

.short-heading{
    color:white;
    font-size:18px;
    font-weight:bold;
    margin-bottom:10px;
}


/* =========================
   SHORT ROW
========================= */

.tiktok-line{
    display:flex;
    gap:12px;
    overflow-x:auto;
    scrollbar-width:none;
}

.tiktok-line::-webkit-scrollbar{
    display:none;
}


/* =========================
   SHORT CARD
========================= */

.tiktok-card{
    min-width:145px;
    width:145px;
    height:210px;
    background:#000;
    border-radius:15px;
    overflow:hidden;
    flex-shrink:0;
    cursor:pointer;
}

.tiktok-card video{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    pointer-events:none;
}

.tiktok-card iframe{
    width:100%;
    height:100%;
    border:0;
    pointer-events:none;
}


/* =========================
   SHORT VIEWER
========================= */

.short-viewer{
    position:fixed;
    inset:0;
    background:#000;
    z-index:5000;
    display:none;
}

.short-viewer.active{
    display:block;
}


/* =========================
   CLOSE
========================= */

.short-close{
    position:fixed;
    top:15px;
    right:15px;
    z-index:7000;
    width:44px;
    height:44px;
    border:none;
    border-radius:50%;
    background:rgba(0,0,0,.55);
    color:white;
    font-size:22px;
}


/* =========================
   SOUND
========================= */

.sound-button{
    position:fixed;
    right:15px;
    bottom:25px;
    z-index:7000;
    width:48px;
    height:48px;
    border:none;
    border-radius:50%;
    background:rgba(0,0,0,.55);
    color:white;
    font-size:22px;
}


/* =========================
   SHORT FEED
========================= */

.short-feed{
    width:100%;
    height:100%;
    overflow-y:auto;
    overflow-x:hidden;
    scroll-snap-type:y mandatory;
    -webkit-overflow-scrolling:touch;
}

.short-item{
    width:100%;
    height:100vh;
    min-height:100vh;
    background:#000;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    scroll-snap-align:start;
    scroll-snap-stop:always;
    overflow:hidden;
}

.short-item video{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.short-item iframe{
    width:100%;
    height:100%;
    border:0;
}


/* =========================
   POSTS
========================= */

.posts{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.post{
    background:white;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 4px 12px rgba(0,0,0,.2);
}

.post-image{
    height:150px;
    background:linear-gradient(135deg,#ddd,#aaa);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:50px;
}

.post-content{
    padding:15px;
}

.post h2{
    margin:0 0 8px;
}

.post p{
    margin:0;
    color:#666;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .posts{
        grid-template-columns:1fr;
    }

    .hero h1{
        font-size:27px;
    }

    .tiktok-card{
        min-width:135px;
        width:135px;
        height:195px;
    }

    .video-card iframe{
        height:300px;
    }

}

</style>
</head>


<body>


<!-- =========================
     TOP BAR
========================= -->

<header class="topbar">

    <button class="menu-button">
        ☰
    </button>

    <div class="site-name">
        🌿 My Video Site
    </div>

    <div class="account">
        👤
    </div>

</header>


<!-- =========================
     ACCOUNT
========================= -->

<div class="account-box">

    <h3>👤 Account</h3>

    <input
        type="email"
        placeholder="Email">

    <input
        type="password"
        placeholder="Password">

    <button class="login-button">
        Login
    </button>

    <button class="signup-button">
        Sign Up
    </button>

</div>


<!-- =========================
     SIDE MENU
========================= -->

<div class="side-menu">

    <button class="close-btn">
        ✕
    </button>

    <div class="menu-title">
        📱 Menu
    </div>

    <a
        href="#home"
        class="menu-item">
        🏠 Home
    </a>

    <a
        href="#short"
        class="menu-item">
        🎵 TikTok Short
    </a>

    <a
        href="#fullvideo"
        class="menu-item">
        🎬 Full Video
    </a>

</div>


<div class="overlay"></div>


<!-- =========================
     MAIN
========================= -->

<main id="home">


<section class="hero">

    <h1>
        Welcome to my website 👋
    </h1>

    <p>
        Watch short & full video
    </p>

</section>


<h2 class="section-title">
    🎬 Videos
</h2>

<div
    id="videoFeed"
    class="video-feed">
</div>


<h2
    id="short"
    class="section-title">

    🎵 TikTok Short

</h2>

<div class="posts">

    <div class="post">

        <div class="post-image">
            🎵
        </div>

        <div class="post-content">

            <h2>
                Short Videos
            </h2>

            <p>
                Tap a Short to watch
            </p>

        </div>

    </div>

</div>


<h2
    id="fullvideo"
    class="section-title">

    🎬 Full Video

</h2>

<div class="posts">

    <div class="post">

        <div class="post-image">
            🎬
        </div>

        <div class="post-content">

            <h2>
                Full Videos
            </h2>

            <p>
                Full videos appear above
            </p>

        </div>

    </div>

</div>

</main>


<!-- =========================
     SHORT VIEWER
========================= -->

<div
    id="shortViewer"
    class="short-viewer">

    <button
        id="shortClose"
        class="short-close">

        ✕

    </button>

    <button
        id="soundButton"
        class="sound-button">

        🔇

    </button>

    <div
        id="shortFeed"
        class="short-feed">
    </div>

</div>


<script>


/* =========================
   MENU
========================= */

const menuButton =
document.querySelector(".menu-button");

const sideMenu =
document.querySelector(".side-menu");

const closeButton =
document.querySelector(".close-btn");

const overlay =
document.querySelector(".overlay");


menuButton.onclick = function(){

    sideMenu.classList.add("active");

    overlay.classList.add("active");

};


closeButton.onclick = function(){

    sideMenu.classList.remove("active");

    overlay.classList.remove("active");

};


overlay.onclick = function(){

    sideMenu.classList.remove("active");

    overlay.classList.remove("active");

};


/* MENU LINK CLICK */

document
.querySelectorAll(".menu-item")
.forEach(function(item){

    item.onclick = function(){

        sideMenu.classList.remove("active");

        overlay.classList.remove("active");

    };

});


/* =========================
   ACCOUNT
========================= */

const account =
document.querySelector(".account");

const accountBox =
document.querySelector(".account-box");


account.onclick = function(){

    accountBox.classList.toggle("active");

};


document.addEventListener(
    "click",
    function(event){

        if(
            !account.contains(event.target) &&
            !accountBox.contains(event.target)
        ){

            accountBox.classList.remove(
                "active"
            );

        }

    }
);


/* =========================
   FULL VIDEOS
========================= */

const fullVideos = [

    {
        type:"jumpshare",
        src:"https://jumpshare.com/embed/YkjIOaRPiSVYTlWqdOhg"
    },

    {
        type:"file",
        src:"full2.mp4"
    },

    {
        type:"file",
        src:"full3.mp4"
    },

    {
        type:"file",
        src:"full4.mp4"
    },

    {
        type:"file",
        src:"full5.mp4"
    },

    {
        type:"file",
        src:"full6.mp4"
    },

    {
        type:"file",
        src:"full7.mp4"
    },

    {
        type:"file",
        src:"full8.mp4"
    },

    {
        type:"file",
        src:"full9.mp4"
    },

    {
        type:"file",
        src:"full10.mp4"
    },

    {
        type:"file",
        src:"full11.mp4"
    }

];


/* =========================
   JUMPSHARE SHORTS
========================= */

const jumpshareShorts = [

    "https://jumpshare.com/embed/iS3VghaMGO6tASQ4MOQA",

    "https://jumpshare.com/embed/XZ8ssnbfpFFufPut2WmQ",

    "https://jumpshare.com/embed/FtwigrQzXck9vJkwqIsA",

    "https://jumpshare.com/embed/94SRSa1glVD5mcqghuiZ",

    "https://jumpshare.com/embed/SIwI3swoOz8pDlupdfxf",

    "https://jumpshare.com/embed/JlctcChAMR3RLdnZJLas",

    "https://jumpshare.com/embed/4T6w3ZiyAm5wIhlUjo5C",

    "https://jumpshare.com/embed/dU2qQXCSYdzicZu90ekg"

];


/* =========================
   MP4 SHORTS
========================= */

const mp4Shorts = [

    "short1.mp4",
    "short2.mp4",
    "short3.mp4",
    "short4.mp4"

];


/* =========================
   SHORT OBJECTS
========================= */

const shortVideos = [

    ...mp4Shorts.map(function(src){

        return {
            type:"file",
            src:src
        };

    }),

    ...jumpshareShorts.map(function(src){

        return {
            type:"jumpshare",
            src:src
        };

    })

];


/* =========================
   RANDOM FUNCTION
========================= */

function shuffle(array){

    for(
        let i=array.length-1;
        i>0;
        i--
    ){

        const j =
        Math.floor(
            Math.random()*(i+1)
        );

        [
            array[i],
            array[j]
        ] =
        [
            array[j],
            array[i]
        ];

    }

    return array;

}


/* =========================
   RANDOM FULL VIDEO
========================= */

const randomFull =
shuffle(
    [...fullVideos]
);


const feed =
document.getElementById(
    "videoFeed"
);


/* =========================
   CREATE FULL VIDEO
========================= */

function createFullVideo(video){

    const card =
    document.createElement("div");

    card.className =
    "video-card";


    /* MP4 */

    if(
        video.type === "file"
    ){

        card.innerHTML = `

            <video
                src="${video.src}"
                controls
                playsinline
                preload="metadata">
            </video>

        `;

    }


    /* JUMPSHARE */

    if(
        video.type === "jumpshare"
    ){

        card.innerHTML = `

            <iframe
                src="${video.src}"
                allow="
                autoplay;
                fullscreen;
                picture-in-picture"
                allowfullscreen>
            </iframe>

        `;

    }


    return card;

}


/* =========================
   CREATE SHORT ROW
========================= */

function createShortRow(){

    const section =
    document.createElement("div");

    section.className =
    "short-section";


    const heading =
    document.createElement("div");

    heading.className =
    "short-heading";

    heading.innerHTML =
    "👉 🎵 Short Videos";


    section.appendChild(
        heading
    );


    const line =
    document.createElement("div");

    line.className =
    "tiktok-line";


    const rowShorts =
    shuffle(
        [...shortVideos]
    );


    rowShorts.forEach(
        function(video){

            const card =
            document.createElement("div");

            card.className =
            "tiktok-card";


            if(
                video.type === "file"
            ){

                card.innerHTML = `

                    <video
                        src="${video.src}"
                        muted
                        autoplay
                        playsinline
                        loop
                        preload="metadata">
                    </video>

                `;

            }


            if(
                video.type === "jumpshare"
            ){

                card.innerHTML = `

                    <iframe
                        src="${video.src}"
                        allow="
                        autoplay;
                        fullscreen;
                        picture-in-picture"
                        allowfullscreen>
                    </iframe>

                `;

            }


            card.onclick =
            function(){

                openShortViewer(
                    video
                );

            };


            line.appendChild(
                card
            );

        }
    );


    section.appendChild(
        line
    );


    return section;

}


/* =========================
   BUILD FEED
========================= */

randomFull.forEach(
    function(video,index){

        feed.appendChild(
            createFullVideo(video)
        );


        if(
            (index + 1) % 4 === 0
        ){

            feed.appendChild(
                createShortRow()
            );

        }

    }
);


/* =========================
   SHORT VIEWER
========================= */

const shortViewer =
document.getElementById(
    "shortViewer"
);

const shortFeed =
document.getElementById(
    "shortFeed"
);

const shortClose =
document.getElementById(
    "shortClose"
);

const soundButton =
document.getElementById(
    "soundButton"
);


let soundOn = false;

let currentVideos = [];


/* =========================
   OPEN SHORT
========================= */

function openShortViewer(
    clickedVideo
){

    shortFeed.innerHTML = "";


    const others =
    shortVideos.filter(
        function(video){

            return video.src !==
                   clickedVideo.src;

        }
    );


    shuffle(others);


    currentVideos = [

        clickedVideo,

        ...others

    ];


    createViewerVideos();


    shortViewer.classList.add(
        "active"
    );


    document.body.style.overflow =
    "hidden";


    soundOn = false;

    soundButton.innerHTML =
    "🔇";


    setTimeout(
        function(){

            playVisibleVideo();

        },
        200
    );

}


/* =========================
   CREATE VIEWER
========================= */

function createViewerVideos(){

    shortFeed.innerHTML = "";


    currentVideos.forEach(
        function(video){

            const item =
            document.createElement(
                "div"
            );

            item.className =
            "short-item";


            if(
                video.type === "file"
            ){

                item.innerHTML = `

                    <video
                        src="${video.src}"
                        autoplay
                        muted
                        loop
                        playsinline
                        preload="auto">
                    </video>

                `;

            }


            if(
                video.type === "jumpshare"
            ){

                item.innerHTML = `

                    <iframe
                        src="${video.src}"
                        allow="
                        autoplay;
                        fullscreen;
                        picture-in-picture"
                        allowfullscreen>
                    </iframe>

                `;

            }


            shortFeed.appendChild(
                item
            );

        }
    );

}


/* =========================
   PLAY VISIBLE MP4
========================= */

function playVisibleVideo(){

    const items =
    shortFeed.querySelectorAll(
        ".short-item"
    );


    let bestItem = null;

    let bestVisibility = 0;


    items.forEach(
        function(item){

            const rect =
            item.getBoundingClientRect();


            const visibleTop =
            Math.max(
                rect.top,
                0
            );


            const visibleBottom =
            Math.min(
                rect.bottom,
                window.innerHeight
            );


            const visible =
            Math.max(
                0,
                visibleBottom -
                visibleTop
            );


            if(
                visible >
                bestVisibility
            ){

                bestVisibility =
                visible;

                bestItem =
                item;

            }

        }
    );


    items.forEach(
        function(item){

            const video =
            item.querySelector(
                "video"
            );


            if(!video){
                return;
            }


            if(
                item === bestItem
            ){

                video.muted =
                !soundOn;

                video.play().catch(
                    function(){}
                );

            }else{

                video.pause();

            }

        }
    );

}


/* =========================
   SCROLL
========================= */

let scrollTimer;

let loadingMore = false;


shortFeed.addEventListener(
    "scroll",
    function(){

        clearTimeout(
            scrollTimer
        );


        scrollTimer =
        setTimeout(
            function(){

                playVisibleVideo();


                if(
                    shortFeed.scrollTop +
                    shortFeed.clientHeight >=
                    shortFeed.scrollHeight - 500
                ){

                    if(!loadingMore){

                        addMoreRandomShorts();

                    }

                }

            },
            80
        );

    }
);


/* =========================
   ADD MORE RANDOM SHORTS
========================= */

function addMoreRandomShorts(){

    loadingMore = true;


    const more =
    shuffle(
        [...shortVideos]
    );


    more.forEach(
        function(video){

            const item =
            document.createElement(
                "div"
            );

            item.className =
            "short-item";


            if(
                video.type === "file"
            ){

                item.innerHTML = `

                    <video
                        src="${video.src}"
                        muted
                        loop
                        playsinline
                        preload="auto">
                    </video>

                `;

            }


            if(
                video.type === "jumpshare"
            ){

                item.innerHTML = `

                    <iframe
                        src="${video.src}"
                        allow="
                        autoplay;
                        fullscreen;
                        picture-in-picture"
                        allowfullscreen>
                    </iframe>

                `;

            }


            shortFeed.appendChild(
                item
            );

        }
    );


    setTimeout(
        function(){

            loadingMore = false;

        },
        500
    );

}


/* =========================
   SOUND
========================= */

soundButton.onclick =
function(event){

    event.stopPropagation();


    soundOn =
    !soundOn;


    const videos =
    shortFeed.querySelectorAll(
        "video"
    );


    videos.forEach(
        function(video){

            video.muted =
            !soundOn;

        }
    );


    playVisibleVideo();


    if(soundOn){

        soundButton.innerHTML =
        "🔊";

    }else{

        soundButton.innerHTML =
        "🔇";

    }

};


/* =========================
   CLOSE SHORT
========================= */

function closeShortViewer(){

    shortViewer.classList.remove(
        "active"
    );


    document.body.style.overflow =
    "";


    shortFeed
        .querySelectorAll("video")
        .forEach(
            function(video){

                video.pause();

            }
        );


    shortFeed.innerHTML =
    "";

}


shortClose.onclick =
function(){

    closeShortViewer();

};


/* =========================
   ESC KEY
========================= */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Escape"
        ){

            if(
                shortViewer.classList
                .contains("active")
            ){

                shortClose.click();

            }

        }

    }
);

</script>
