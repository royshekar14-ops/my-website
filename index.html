
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unique 3D Periodic Table</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background:
        radial-gradient(circle at center, #172b3e, #080d18 75%);
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
    text-align: center;
}

h1 {
    margin: 18px 0 5px;
    font-size: 28px;
    letter-spacing: 4px;
    color: #00eaff;
    text-shadow: 0 0 15px #00eaff;
}

.subtitle {
    color: #8299aa;
    font-size: 11px;
    letter-spacing: 3px;
    margin-bottom: 15px;
}

.buttons {
    position: relative;
    z-index: 10;
    margin-bottom: 10px;
}

button {
    padding: 10px 16px;
    margin: 3px;
    border: 1px solid #00eaff66;
    border-radius: 20px;
    background: #142638;
    color: white;
    cursor: pointer;
    transition: 0.3s;
}

button.active {
    background: #00eaff;
    color: #06111b;
    box-shadow: 0 0 15px #00eaff;
}

.scene {
    width: 100%;
    height: 72vh;
    perspective: 1100px;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    touch-action: pan-y;
}

.world {
    position: relative;
    width: 1px;
    height: 1px;
    transform-style: preserve-3d;
    transition: transform 0.12s ease-out;
}

.element {
    position: absolute;
    width: 48px;
    height: 54px;

    border: 1px solid currentColor;
    border-radius: 9px;

    background: rgba(10,30,50,0.85);

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    transform-style: preserve-3d;

    box-shadow:
        0 0 8px currentColor,
        inset 0 0 10px currentColor;

    transition:
        transform 0.7s cubic-bezier(.2,.8,.2,1),
        background 0.3s,
        box-shadow 0.3s;

    cursor: pointer;
}

.element::before {
    content: "";
    position: absolute;
    inset: 3px;
    border: 1px solid currentColor;
    border-radius: 6px;
    opacity: 0.3;
    pointer-events: none;
}

.element:hover {
    background: #263d60;
    box-shadow:
        0 0 20px currentColor,
        inset 0 0 15px currentColor;
    z-index: 100;
}

.symbol {
    font-size: 18px;
    font-weight: bold;
}

.name {
    font-size: 7px;
    margin-top: 2px;
}

.number {
    font-size: 8px;
    opacity: 0.8;
}

/* Original element colors */

.element:nth-child(4n) {
    color: #ff6464;
}

.element:nth-child(4n+1) {
    color: #ffd166;
}

.element:nth-child(4n+2) {
    color: #06d6a0;
}

.element:nth-child(4n+3) {
    color: #4cc9f0;
}

/* Details popup */

.overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.details {
    width: 310px;
    max-width: 100%;
    padding: 25px;
    border: 1px solid #00eaff;
    border-radius: 18px;
    background: linear-gradient(145deg,#19344b,#071321);
    box-shadow: 0 0 35px #00eaff55;
    text-align: left;
    animation: popup 0.3s ease;
}

@keyframes popup {
    from {
        transform: scale(0.7);
        opacity: 0;
    }
    to {
        transform: scale(1);
        opacity: 1;
    }
}

.details h2 {
    color: #00eaff;
    text-align: center;
}

.details p {
    line-height: 1.8;
    font-size: 14px;
}

.close {
    display: block;
    margin: 15px auto 0;
    background: #00eaff;
    color: black;
}

.hint {
    color: #8299aa;
    font-size: 11px;
    letter-spacing: 1px;
}
</style>
</head>

<body>

<h1>PERIODIC TABLE</h1>
<div class="subtitle">INTERACTIVE 3D ELEMENTS</div>

<div class="buttons">
    <button class="active" onclick="changeMode('table',this)">Table</button>
    <button onclick="changeMode('sphere',this)">Sphere</button>
    <button onclick="changeMode('helix',this)">Helix</button>
    <button onclick="changeMode('grid',this)">Grid</button>
</div>

<div class="scene" id="scene">
    <div class="world" id="world"></div>
</div>

<p class="hint">MOVE YOUR MOUSE OR TOUCH TO CONTROL 3D</p>

<div class="overlay" id="overlay">
    <div class="details">
        <h2 id="detailSymbol"></h2>
        <p id="detailInfo"></p>
        <button class="close" onclick="closeDetails()">CLOSE</button>
    </div>
</div>

<script>

const data = [
["H","Hydrogen",1,1.008,"Used in fuel and water"],
["He","Helium",2,4.0026,"Used in balloons"],
["Li","Lithium",3,6.94,"Used in batteries"],
["Be","Beryllium",4,9.0122,"Used in aerospace"],
["B","Boron",5,10.81,"Used in glass"],
["C","Carbon",6,12.011,"Found in living organisms"],
["N","Nitrogen",7,14.007,"Used in fertilizers"],
["O","Oxygen",8,15.999,"Essential for respiration"],
["F","Fluorine",9,18.998,"Used in toothpaste compounds"],
["Ne","Neon",10,20.180,"Used in glowing signs"],
["Na","Sodium",11,22.990,"Found in table salt"],
["Mg","Magnesium",12,24.305,"Used in alloys"],
["Al","Aluminium",13,26.982,"Used in aircraft"],
["Si","Silicon",14,28.085,"Used in computer chips"],
["P","Phosphorus",15,30.974,"Used in fertilizers"],
["S","Sulfur",16,32.06,"Used in industries"],
["Cl","Chlorine",17,35.45,"Used in water treatment"],
["Ar","Argon",18,39.948,"Used in light bulbs"],
["K","Potassium",19,39.098,"Important for plants"],
["Ca","Calcium",20,40.078,"Important for bones"]
];

const world = document.getElementById("world");
const scene = document.getElementById("scene");

let cards = [];

data.forEach((element,i) => {

    const card = document.createElement("div");

    card.className = "element";

    card.innerHTML = `
        <div class="number">${element[2]}</div>
        <div class="symbol">${element[0]}</div>
        <div class="name">${element[1]}</div>
    `;

    card.addEventListener("click", () => {
        showDetails(element);
    });

    world.appendChild(card);
    cards.push(card);

});

function changeMode(mode,button) {

    document.querySelectorAll(".buttons button")
    .forEach(b => b.classList.remove("active"));

    button.classList.add("active");

    const total = cards.length;

    cards.forEach((card,i) => {

        let x,y,z;

        if(mode === "table") {

            let col = i % 5;
            let row = Math.floor(i / 5);

            x = (col-2)*65;
            y = (row-1.5)*68;
            z = 0;

        }

        else if(mode === "sphere") {

            let phi = Math.acos(1-2*(i+0.5)/total);
            let theta = Math.PI*(1+Math.sqrt(5))*i;

            let r = 125;

            x = r*Math.sin(phi)*Math.cos(theta);
            y = r*Math.sin(phi)*Math.sin(theta);
            z = r*Math.cos(phi);

        }

        else if(mode === "helix") {

            let angle = i*0.55;
            let r = 95;

            x = r*Math.cos(angle);
            y = (i-total/2)*12;
            z = r*Math.sin(angle);

        }

        else if(mode === "grid") {

            let col = i%4;
            let row = Math.floor(i/4);

            x = (col-1.5)*75;
            y = (row-2)*65;
            z = (i%3)*35;

        }

        card.style.transform =
        `translate3d(${x}px,${y}px,${z}px)`;

    });

}

// Mouse movement

let targetX = 0;
let targetY = 0;
let rotateX = 0;
let rotateY = 0;

scene.addEventListener("pointermove", (event) => {

    const rect = scene.getBoundingClientRect();

    const x = (event.clientX-rect.left)/rect.width;
    const y = (event.clientY-rect.top)/rect.height;

    targetY = (x-0.5)*55;
    targetX = (0.5-y)*45;

});

scene.addEventListener("pointerleave", () => {
    targetX = 0;
    targetY = 0;
});

// Smooth animation

function animate() {

    rotateX += (targetX-rotateX)*0.08;
    rotateY += (targetY-rotateY)*0.08;

    world.style.transform =
    `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;

    requestAnimationFrame(animate);

}

// Element details

function showDetails(element) {

    document.getElementById("detailSymbol").innerText =
        element[0] + " - " + element[1];

    document.getElementById("detailInfo").innerHTML = `
        <b>Atomic Number:</b> ${element[2]}<br>
        <b>Name:</b> ${element[1]}<br>
        <b>Symbol:</b> ${element[0]}<br>
        <b>Atomic Mass:</b> ${element[3]} u<br>
        <b>Uses:</b> ${element[4]}
    `;

    document.getElementById("overlay").style.display = "flex";
}

function closeDetails() {
    document.getElementById("overlay").style.display = "none";
}

// Start

changeMode("table",document.querySelector(".buttons button"));

animate();

</script>

</body>
</html>
