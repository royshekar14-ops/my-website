<!DOCTYPE html>
<html>
<head>
    <title>Lotus and Rising Sun</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #07111f;
        }

        /* =========================
           FIRST SCREEN
        ========================= */

        .first-screen {
            position: absolute;
            width: 100%;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #07111f;

            animation: firstScreenOut 1.5s ease-in-out 6s forwards;
        }

        .lotus-area {
            position: relative;

            display: flex;
            justify-content: center;
            align-items: center;

            gap: 35px;

            transform: scale(1.25);
        }

        /* =========================
           LOTUS
        ========================= */

        .lotus {
            position: relative;

            width: 320px;
            height: 300px;
        }

        .second-lotus {
            transform: scaleX(-1);
        }

        .petal {
            position: absolute;

            width: 100px;
            height: 175px;

            left: 110px;
            top: 55px;

            background: linear-gradient(
                to top,
                #d92f83,
                #f85ca5,
                #ffd6e8
            );

            border-radius: 50% 50% 45% 45%;

            transform-origin: bottom center;

            box-shadow:
                inset 0 -12px 18px rgba(120, 0, 70, 0.2),
                0 4px 15px rgba(255, 100, 180, 0.3);
        }

        .p1 {
            transform: rotate(-65deg) scale(0);
            animation: bloom1 2s ease-out 0s forwards;
        }

        .p2 {
            transform: rotate(-45deg) scale(0);
            animation: bloom2 2s ease-out 0.1s forwards;
        }

        .p3 {
            transform: rotate(-25deg) scale(0);
            animation: bloom3 2s ease-out 0.2s forwards;
        }

        .p4 {
            transform: rotate(-10deg) scale(0);
            animation: bloom4 2s ease-out 0.3s forwards;
        }

        .p5 {
            transform: rotate(10deg) scale(0);
            animation: bloom5 2s ease-out 0.3s forwards;
        }

        .p6 {
            transform: rotate(25deg) scale(0);
            animation: bloom6 2s ease-out 0.2s forwards;
        }

        .p7 {
            transform: rotate(45deg) scale(0);
            animation: bloom7 2s ease-out 0.1s forwards;
        }

        .p8 {
            transform: rotate(65deg) scale(0);
            animation: bloom8 2s ease-out 0s forwards;
        }

        .inner {
            width: 82px;
            height: 140px;

            top: 85px;
            left: 119px;

            z-index: 10;
        }

        .i1 {
            transform: rotate(-40deg) scale(0);
            animation: inner1 2s ease-out 0.7s forwards;
        }

        .i2 {
            transform: rotate(-20deg) scale(0);
            animation: inner2 2s ease-out 0.8s forwards;
        }

        .i3 {
            transform: rotate(20deg) scale(0);
            animation: inner3 2s ease-out 0.8s forwards;
        }

        .i4 {
            transform: rotate(40deg) scale(0);
            animation: inner4 2s ease-out 0.7s forwards;
        }

        .center {
            position: absolute;

            width: 70px;
            height: 70px;

            left: 125px;
            top: 135px;

            border-radius: 50%;

            background: radial-gradient(
                circle at 35% 30%,
                #fff9c4,
                #ffe071 35%,
                #ffc13d 70%,
                #e99b20
            );

            z-index: 30;

            box-shadow:
                0 0 22px rgba(255, 215, 80, 0.9);
        }

        /* =========================
           SUN
        ========================= */

        .sun-area {
            position: absolute;

            left: 50%;
            top: 50%;

            width: 250px;
            height: 250px;

            transform:
                translate(-50%, -50%)
                translateY(170px);

            z-index: 100;

            animation:
                sunRise 2.5s ease-out 0s forwards;
        }

        .rays {
            position: absolute;

            left: 50%;
            top: 50%;

            width: 250px;
            height: 250px;

            transform:
                translate(-50%, -50%);

            border-radius: 50%;

            background:
                repeating-conic-gradient(
                    from 0deg,
                    rgba(255, 215, 70, 0.65) 0deg 5deg,
                    transparent 5deg 15deg
                );

            filter: blur(2px);

            opacity: 0;

            z-index: 1;

            animation:
                raysAppear 1.5s ease-out 0s forwards;
        }

        .sun {
            position: absolute;

            left: 50%;
            top: 50%;

            width: 125px;
            height: 125px;

            transform:
                translate(-50%, -50%);

            border-radius: 50%;

            background: radial-gradient(
                circle,
                #fffbd0 0%,
                #fff176 25%,
                #ffd43b 60%,
                #ff9d00 100%
            );

            box-shadow:
                0 0 30px #ffd43b,
                0 0 70px #ffb300,
                0 0 110px rgba(255, 179, 0, 0.6);

            z-index: 2;

            animation:
                sunGlow 2s ease-in-out 2.5s infinite alternate;
        }

        /* =========================
           GRASS
        ========================= */

        .grass {
            position: absolute;

            bottom: 0;
            left: 0;

            width: 100%;
            height: 115px;

            z-index: 150;

            background:
                linear-gradient(
                    to top,
                    #071f12,
                    #0b3d20
                );

            clip-path: polygon(
                0 35%,
                3% 20%,
                6% 38%,
                9% 12%,
                12% 35%,
                15% 18%,
                18% 40%,
                21% 10%,
                24% 35%,
                27% 15%,
                30% 38%,
                33% 12%,
                36% 35%,
                39% 18%,
                42% 40%,
                45% 10%,
                48% 35%,
                51% 15%,
                54% 38%,
                57% 12%,
                60% 35%,
                63% 18%,
                66% 40%,
                69% 10%,
                72% 35%,
                75% 15%,
                78% 38%,
                81% 12%,
                84% 35%,
                87% 18%,
                90% 40%,
                93% 10%,
                96% 35%,
                100% 18%,
                100% 100%,
                0 100%
            );
        }

        /* =========================
           SMALL FLOWERS IN GRASS
        ========================= */

        .field-flower {
            position: absolute;

            width: 13px;
            height: 13px;

            border-radius: 50%;

            background: #ff75b5;

            box-shadow:
                0 0 8px rgba(255, 120, 190, 0.8);
        }

        .field-flower::before,
        .field-flower::after {
            content: "";

            position: absolute;

            width: 13px;
            height: 13px;

            border-radius: 50%;

            background: #ffb6dc;
        }

        .field-flower::before {
            left: -7px;
        }

        .field-flower::after {
            left: 7px;
        }

        .flower1 {
            left: 12%;
            bottom: 45px;
        }

        .flower2 {
            left: 28%;
            bottom: 25px;
        }

        .flower3 {
            left: 48%;
            bottom: 48px;
        }

        .flower4 {
            left: 68%;
            bottom: 30px;
        }

        .flower5 {
            left: 85%;
            bottom: 50px;
        }

        /* =========================
           SECOND SCREEN
        ========================= */

        .welcome-screen {
            position: absolute;

            width: 100%;
            height: 100vh;

            background: #000;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            text-align: center;

            opacity: 0;

            z-index: 500;

            animation:
                welcomeShow 1.5s ease-in-out 6s forwards;
        }

        .welcome-screen h1 {
            margin: 0;

            color: white;

            font-size: 42px;

            letter-spacing: 2px;
        }

        .welcome-screen p {
            color: #aaa;

            font-size: 17px;

            margin-top: 12px;
        }

        .collection-button {
            margin-top: 30px;

            padding: 15px 28px;

            border: 1px solid #ffd43b;

            border-radius: 30px;

            background: transparent;

            color: #ffd43b;

            font-size: 16px;

            cursor: pointer;

            transition: 0.3s;
        }

        .collection-button:hover {
            background: #ffd43b;

            color: #000;

            box-shadow:
                0 0 25px rgba(255, 212, 59, 0.8);

            transform: translateY(-3px);
        }

        /* =========================
           ANIMATIONS
        ========================= */

        @keyframes sunRise {

            0% {
                transform:
                    translate(-50%, -50%)
                    translateY(170px);

                opacity: 0;
            }

            70% {
                transform:
                    translate(-50%, -50%)
                    translateY(-10px);

                opacity: 1;
            }

            100% {
                transform:
                    translate(-50%, -50%)
                    translateY(0);

                opacity: 1;
            }
        }

        @keyframes raysAppear {

            from {
                opacity: 0;

                transform:
                    translate(-50%, -50%)
                    scale(0.2);
            }

            to {
                opacity: 0.45;

                transform:
                    translate(-50%, -50%)
                    scale(1);
            }
        }

        @keyframes sunGlow {

            from {
                box-shadow:
                    0 0 30px #ffd43b,
                    0 0 70px #ffb300,
                    0 0 110px rgba(255, 179, 0, 0.5);
            }

            to {
                box-shadow:
                    0 0 45px #fff176,
                    0 0 100px #ffb300,
                    0 0 150px rgba(255, 179, 0, 0.8);
            }
        }

        @keyframes bloom1 {
            to {
                transform: rotate(-65deg) scale(1);
            }
        }

        @keyframes bloom2 {
            to {
                transform: rotate(-45deg) scale(1);
            }
        }

        @keyframes bloom3 {
            to {
                transform: rotate(-25deg) scale(1);
            }
        }

        @keyframes bloom4 {
            to {
                transform: rotate(-10deg) scale(1);
            }
        }

        @keyframes bloom5 {
            to {
                transform: rotate(10deg) scale(1);
            }
        }

        @keyframes bloom6 {
            to {
                transform: rotate(25deg) scale(1);
            }
        }

        @keyframes bloom7 {
            to {
                transform: rotate(45deg) scale(1);
            }
        }

        @keyframes bloom8 {
            to {
                transform: rotate(65deg) scale(1);
            }
        }

        @keyframes inner1 {
            to {
                transform: rotate(-40deg) scale(1);
            }
        }

        @keyframes inner2 {
            to {
                transform: rotate(-20deg) scale(1);
            }
        }

        @keyframes inner3 {
            to {
                transform: rotate(20deg) scale(1);
            }
        }

        @keyframes inner4 {
            to {
                transform: rotate(40deg) scale(1);
            }
        }

        @keyframes firstScreenOut {
            0% {
                opacity: 1;
            }

            100% {
                opacity: 0;
                visibility: hidden;
            }
        }

        @keyframes welcomeShow {

            0% {
                opacity: 0;
                transform: scale(1.05);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

    </style>
</head>

<body>

    <!-- FIRST SCREEN -->

    <div class="first-screen">

        <div class="lotus-area">

            <!-- LEFT LOTUS -->

            <div class="lotus">

                <div class="petal p1"></div>
                <div class="petal p2"></div>
                <div class="petal p3"></div>
                <div class="petal p4"></div>
                <div class="petal p5"></div>
                <div class="petal p6"></div>
                <div class="petal p7"></div>
                <div class="petal p8"></div>

                <div class="petal inner i1"></div>
                <div class="petal inner i2"></div>
                <div class="petal inner i3"></div>
                <div class="petal inner i4"></div>

                <div class="center"></div>

            </div>

            <!-- RIGHT LOTUS -->

            <div class="lotus second-lotus">

                <div class="petal p1"></div>
                <div class="petal p2"></div>
                <div class="petal p3"></div>
                <div class="petal p4"></div>
                <div class="petal p5"></div>
                <div class="petal p6"></div>
                <div class="petal p7"></div>
                <div class="petal p8"></div>

                <div class="petal inner i1"></div>
                <div class="petal inner i2"></div>
                <div class="petal inner i3"></div>
                <div class="petal inner i4"></div>

                <div class="center"></div>

            </div>

            <!-- SUN -->

            <div class="sun-area">

                <div class="rays"></div>

                <div class="sun"></div>

            </div>

        </div>

        <!-- GRASS -->

        <div class="grass">

            <div class="field-flower flower1"></div>
            <div class="field-flower flower2"></div>
            <div class="field-flower flower3"></div>
            <div class="field-flower flower4"></div>
            <div class="field-flower flower5"></div>

        </div>

    </div>


    <!-- SECOND SCREEN -->

    <div class="welcome-screen">

        <h1>Welcome to My Creative World</h1>

        <p>Discover something legendary.</p>

        <button class="collection-button">
            View My Legendary Collection
        </button>

    </div>

</body>
</html>
