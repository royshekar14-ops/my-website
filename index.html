
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive 3D Periodic Table</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080d18;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
    text-align: center;
}

h1 {
    margin: 18px 0;
    font-size: 28px;
    color: #00eaff;
    text-shadow: 0 0 15px #00eaff;
}

.buttons {
    position: relative;
    z-index: 10;
}

button {
    padding: 10px 15px;
    margin: 4px;
    border: 1px solid #00eaff;
    border-radius: 8px;
    background: #101d30;
    color: white;
    cursor: pointer;
}

button.active,
button:hover {
    background: #00eaff;
    color: black;
}

.scene {
    width: 100%;
    height: 75vh;
    perspective: 1000px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    touch-action: pan-y;
}

.world {
    position: relative;
    width: 1px;
    height: 1px;
    transform-style: preserve-3d;
    transition: transform 0.12s ease-out;
}

.element {
    position: absolute;
    width: 52px;
    height: 60px;
    border: 1px solid currentColor;
    border-radius: 7px;
    background: rgba(10,30,50,0.9);
    box-shadow: 0 0 10px currentColor;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    transform-style: preserve-3d;
    transition: transform 0.5s, background 0.3s;
    cursor: pointer;
    backface-visibility: visible;
}

.element:hover {
    background: #263d60;
    z-index: 100;
    box-shadow: 0 0 25px currentColor;
}

.symbol {
    font-size: 19px;
    font-weight: bold;
}

.name {
    font-size: 8px;
}

.number {
    font-size: 9px;
}

.element:nth-child(4n) {
    color: #ff6464;
}

.element:nth-child(4n+1) {
    color: #ffd166;
}

.element:nth-child(4n+2) {
    color: #06d6a0;
}

.element:nth-child(4n+3) {
    color: #4cc9f0;
}

/* Details popup */

.overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.details {
    width: 300px;
    max-width: 100%;
    padding: 25px;
    border: 1px solid #00eaff;
    border-radius: 15px;
    background: #101d30;
    box-shadow: 0 0 30px #00eaff;
    text-align: left;
}

.details h2 {
    color: #00eaff;
    text-align: center;
}

.details p {
    line-height: 1.7;
}

.close {
    display: block;
    margin: 15px auto 0;
    background: #00eaff;
    color: black;
}

.hint {
    color: #aaa;
    font-size: 12px;
    margin-top: 15px;
}
</style>
</head>

<body>

<h1>3D PERIODIC TABLE</h1>

<div class="buttons">
    <button class="active" onclick="changeMode('table',this)">Table</button>
    <button onclick="changeMode('sphere',this)">Sphere</button>
    <button onclick="changeMode('helix',this)">Helix</button>
    <button onclick="changeMode('grid',this)">Grid</button>
</div>

<div class="scene" id="scene">
    <div class="world" id="world"></div>
</div>

<p class="hint">Move your mouse or finger to control the 3D effect. Click an element for details.</p>

<div class="overlay" id="overlay">
    <div class="details">
        <h2 id="detailSymbol"></h2>
        <p id="detailInfo"></p>
        <button class="close" onclick="closeDetails()">Close</button>
    </div>
</div>

<script>

const data = [
["H","Hydrogen",1,1.008,"Used in fuel and water"],
["He","Helium",2,4.0026,"Used in balloons"],
["Li","Lithium",3,6.94,"Used in rechargeable batteries"],
["Be","Beryllium",4,9.0122,"Used in aerospace materials"],
["B","Boron",5,10.81,"Used in glass and detergents"],
["C","Carbon",6,12.011,"Found in living organisms"],
["N","Nitrogen",7,14.007,"Used in fertilizers"],
["O","Oxygen",8,15.999,"Essential for respiration"],
["F","Fluorine",9,18.998,"Used in toothpaste compounds"],
["Ne","Neon",10,20.180,"Used in glowing signs"],
["Na","Sodium",11,22.990,"Found in table salt"],
["Mg","Magnesium",12,24.305,"Used in lightweight alloys"],
["Al","Aluminium",13,26.982,"Used in cans and aircraft"],
["Si","Silicon",14,28.085,"Used in computer chips"],
["P","Phosphorus",15,30.974,"Used in fertilizers"],
["S","Sulfur",16,32.06,"Used in chemical industries"],
["Cl","Chlorine",17,35.45,"Used in water treatment"],
["Ar","Argon",18,39.948,"Used in light bulbs"],
["K","Potassium",19,39.098,"Important for plant growth"],
["Ca","Calcium",20,40.078,"Important for bones and teeth"]
];

const world = document.getElementById("world");
const scene = document.getElementById("scene");

let cards = [];
let positions = [];
let currentMode = "table";

data.forEach((element,i) => {

    const card = document.createElement("div");

    card.className = "element";

    card.innerHTML = `
        <div class="number">${element[2]}</div>
        <div class="symbol">${element[0]}</div>
        <div class="name">${element[1]}</div>
    `;

    card.addEventListener("click", () => {
        showDetails(element);
    });

    world.appendChild(card);
    cards.push(card);

});

function changeMode(mode,button) {

    currentMode = mode;

    document.querySelectorAll(".buttons button")
    .forEach(b => b.classList.remove("active"));

    button.classList.add("active");

    const total = cards.length;

    cards.forEach((card,i) => {

        let x,y,z;

        if(mode === "table") {

            let col = i % 5;
            let row = Math.floor(i / 5);

            x = (col-2)*85;
            y = (row-1.5)*85;
            z = 0;

        }

        else if(mode === "sphere") {

            let phi = Math.acos(1-2*(i+0.5)/total);
            let theta = Math.PI*(1+Math.sqrt(5))*i;

            let r = 200;

            x = r*Math.sin(phi)*Math.cos(theta);
            y = r*Math.sin(phi)*Math.sin(theta);
            z = r*Math.cos(phi);

        }

        else if(mode === "helix") {

            let angle = i*0.8;
            let r = 150;

            x = r*Math.cos(angle);
            y = (i-total/2)*20;
            z = r*Math.sin(angle);

        }

        else if(mode === "grid") {

            let col = i%4;
            let row = Math.floor(i/4);

            x = (col-1.5)*100;
            y = (row-2)*85;
            z = (i%3)*45;

        }

        positions[i] = {x,y,z};

        card.style.transform =
        `translate3d(${x}px,${y}px,${z}px)`;

    });

}

function showDetails(element) {

    document.getElementById("detailSymbol").innerText =
        element[0] + " - " + element[1];

    document.getElementById("detailInfo").innerHTML = `
        <b>Atomic Number:</b> ${element[2]}<br>
        <b>Element:</b> ${element[1]}<br>
        <b>Symbol:</b> ${element[0]}<br>
        <b>Atomic Mass:</b> ${element[3]} u<br>
        <b>Uses:</b> ${element[4]}
    `;

    document.getElementById("overlay").style.display = "flex";

}

function closeDetails() {
    document.getElementById("overlay").style.display = "none";
}

// Mouse and touch movement

let targetX = 0;
let targetY = 0;
let rotateX = 0;
let rotateY = 0;

scene.addEventListener("pointermove", (event) => {

    const rect = scene.getBoundingClientRect();

    const x = (event.clientX - rect.left) / rect.width;
    const y = (event.clientY - rect.top) / rect.height;

    targetY = (x-0.5)*65;
    targetX = (0.5-y)*50;

});

scene.addEventListener("pointerleave", () => {
    targetX = 0;
    targetY = 0;
});

// Smooth animation

function animate() {

    rotateX += (targetX-rotateX)*0.08;
    rotateY += (targetY-rotateY)*0.08;

    world.style.transform =
    `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;

    requestAnimationFrame(animate);

}

// Start

changeMode("table",document.querySelector(".buttons button"));

animate();

</script>

</body>
</html>
