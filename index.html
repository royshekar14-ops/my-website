 <!DOCTYPE html>
<html>
<head>
    <title>My Creative World</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #050505;
            color: white;
        }

        /* =================================
           FIRST ANIMATION SCREEN
        ================================= */

        .first-screen {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100vh;

            background: #07111f;

            display: flex;
            justify-content: center;
            align-items: center;

            z-index: 1000;

            animation:
                firstScreenOut 1.5s ease-in-out 6s forwards;
        }

        .lotus-area {
            position: relative;

            display: flex;
            justify-content: center;
            align-items: center;

            gap: 20px;

            transform: scale(1.1);
        }

        /* =================================
           LOTUS
        ================================= */

        .lotus {
            position: relative;

            width: 300px;
            height: 300px;
        }

        .second-lotus {
            transform: scaleX(-1);
        }

        .petal {
            position: absolute;

            width: 95px;
            height: 165px;

            left: 102px;
            top: 65px;

            background: linear-gradient(
                to top,
                #d92f83,
                #f85ca5,
                #ffd6e8
            );

            border-radius: 50% 50% 45% 45%;

            transform-origin: bottom center;

            box-shadow:
                inset 0 -12px 18px rgba(120, 0, 70, 0.2),
                0 4px 15px rgba(255, 100, 180, 0.3);
        }

        .p1 {
            transform: rotate(-65deg) scale(0);
            animation: bloom1 2s ease-out 0s forwards;
        }

        .p2 {
            transform: rotate(-45deg) scale(0);
            animation: bloom2 2s ease-out .1s forwards;
        }

        .p3 {
            transform: rotate(-25deg) scale(0);
            animation: bloom3 2s ease-out .2s forwards;
        }

        .p4 {
            transform: rotate(-10deg) scale(0);
            animation: bloom4 2s ease-out .3s forwards;
        }

        .p5 {
            transform: rotate(10deg) scale(0);
            animation: bloom5 2s ease-out .3s forwards;
        }

        .p6 {
            transform: rotate(25deg) scale(0);
            animation: bloom6 2s ease-out .2s forwards;
        }

        .p7 {
            transform: rotate(45deg) scale(0);
            animation: bloom7 2s ease-out .1s forwards;
        }

        .p8 {
            transform: rotate(65deg) scale(0);
            animation: bloom8 2s ease-out 0s forwards;
        }

        .inner {
            width: 78px;
            height: 130px;

            top: 95px;
            left: 110px;

            z-index: 10;
        }

        .i1 {
            transform: rotate(-40deg) scale(0);
            animation: inner1 2s ease-out .7s forwards;
        }

        .i2 {
            transform: rotate(-20deg) scale(0);
            animation: inner2 2s ease-out .8s forwards;
        }

        .i3 {
            transform: rotate(20deg) scale(0);
            animation: inner3 2s ease-out .8s forwards;
        }

        .i4 {
            transform: rotate(40deg) scale(0);
            animation: inner4 2s ease-out .7s forwards;
        }

        .center {
            position: absolute;

            width: 70px;
            height: 70px;

            left: 115px;
            top: 140px;

            border-radius: 50%;

            background: radial-gradient(
                circle at 35% 30%,
                #fff9c4,
                #ffe071 35%,
                #ffc13d 70%,
                #e99b20
            );

            z-index: 30;

            box-shadow:
                0 0 25px rgba(255, 215, 80, .9);
        }

        /* =================================
           SUN
        ================================= */

        .sun-area {
            position: absolute;

            left: 50%;
            top: 50%;

            width: 280px;
            height: 280px;

            transform:
                translate(-50%, -50%)
                translateY(180px);

            z-index: 100;

            animation:
                sunRise 2.5s ease-out forwards;
        }

        .rays {
            position: absolute;

            left: 50%;
            top: 50%;

            width: 270px;
            height: 270px;

            transform:
                translate(-50%, -50%);

            border-radius: 50%;

            background:
                repeating-conic-gradient(
                    from 0deg,
                    rgba(255, 215, 70, .65) 0deg 5deg,
                    transparent 5deg 15deg
                );

            filter: blur(2px);

            opacity: 0;

            animation:
                raysAppear 1.5s ease-out forwards;
        }

        .sun {
            position: absolute;

            left: 50%;
            top: 50%;

            width: 135px;
            height: 135px;

            transform:
                translate(-50%, -50%);

            border-radius: 50%;

            background: radial-gradient(
                circle,
                #fffbd0,
                #fff176 25%,
                #ffd43b 60%,
                #ff9d00
            );

            box-shadow:
                0 0 35px #ffd43b,
                0 0 80px #ffb300,
                0 0 120px rgba(255, 179, 0, .6);

            animation:
                sunGlow 2s ease-in-out 2.5s infinite alternate;
        }

        /* =================================
           WELCOME / GALLERY
        ================================= */

        .welcome-screen {
            min-height: 100vh;

            padding:
                100px 20px
                80px;

            background:
                radial-gradient(
                    circle at top,
                    #151515,
                    #050505 55%
                );

            text-align: center;

            opacity: 0;

            animation:
                welcomeShow 1.5s ease-in-out 6s forwards;
        }

        .welcome-screen h1 {
            margin: 0;

            font-size: clamp(38px, 7vw, 72px);

            line-height: 1.15;

            letter-spacing: 2px;

            color: white;

            text-shadow:
                0 0 15px rgba(255,255,255,.5),
                0 0 40px rgba(255,180,50,.35);
        }

        .welcome-screen > p {
            margin:
                20px auto 35px;

            color: #aaa;

            font-size: 19px;
        }

        /* =================================
           MAIN VIDEO
        ================================= */

        .video-player {
            width: min(100%, 1000px);

            margin: 0 auto;

            background: #111;

            padding: 12px;

            border-radius: 18px;

            box-shadow:
                0 0 35px rgba(255,190,50,.12);
        }

        .video-player video {
            display: block;

            width: 100%;

            max-height: 560px;

            background: #000;

            border-radius: 12px;
        }

        .current-title {
            margin-top: 15px;

            font-size: 22px;

            color: #ffd43b;
        }

        /* =================================
           VIDEO COLLECTION
        ================================= */

        .collection {
            width: min(100%, 1100px);

            margin: 70px auto 0;
        }

        .collection h2 {
            font-size: 32px;

            margin-bottom: 30px;
        }

        .video-grid {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 22px;
        }

        .video-card {
            background: #111;

            border: 1px solid #252525;

            border-radius: 15px;

            overflow: hidden;

            cursor: pointer;

            transition:
                transform .3s,
                border-color .3s,
                box-shadow .3s;
        }

        .video-card:hover {
            transform: translateY(-7px);

            border-color: #ffd43b;

            box-shadow:
                0 10px 30px rgba(255,210,50,.15);
        }

        .video-card.active {
            border-color: #ffd43b;

            box-shadow:
                0 0 20px rgba(255,210,50,.25);
        }

        .thumbnail {
            height: 180px;

            background:
                linear-gradient(
                    135deg,
                    #202020,
                    #080808
                );

            display: flex;

            justify-content: center;

            align-items: center;

            font-size: 55px;

            color: #ffd43b;
        }

        .video-card h3 {
            margin: 0;

            padding: 18px;

            font-size: 18px;

            color: white;
        }

        /* =================================
           BUTTON
        ================================= */

        .collection-button {
            display: inline-block;

            margin-top: 35px;

            padding: 16px 30px;

            border: 1px solid #ffd43b;

            border-radius: 30px;

            background: transparent;

            color: #ffd43b;

            font-size: 17px;

            cursor: pointer;

            transition: .3s;
        }

        .collection-button:hover {
            background: #ffd43b;

            color: #000;

            box-shadow:
                0 0 30px rgba(255,210,50,.6);
        }

        /* =================================
           ANIMATIONS
        ================================= */

        @keyframes sunRise {

            0% {
                transform:
                    translate(-50%, -50%)
                    translateY(180px);

                opacity: 0;
            }

            70% {
                transform:
                    translate(-50%, -50%)
                    translateY(-10px);

                opacity: 1;
            }

            100% {
                transform:
                    translate(-50%, -50%)
                    translateY(0);

                opacity: 1;
            }
        }

        @keyframes raysAppear {

            from {
                opacity: 0;

                transform:
                    translate(-50%, -50%)
                    scale(.2);
            }

            to {
                opacity: .45;

                transform:
                    translate(-50%, -50%)
                    scale(1);
            }
        }

        @keyframes sunGlow {

            from {
                box-shadow:
                    0 0 35px #ffd43b,
                    0 0 80px #ffb300,
                    0 0 120px rgba(255,179,0,.5);
            }

            to {
                box-shadow:
                    0 0 50px #fff176,
                    0 0 110px #ffb300,
                    0 0 160px rgba(255,179,0,.8);
            }
        }

        @keyframes bloom1 {
            to { transform: rotate(-65deg) scale(1); }
        }

        @keyframes bloom2 {
            to { transform: rotate(-45deg) scale(1); }
        }

        @keyframes bloom3 {
            to { transform: rotate(-25deg) scale(1); }
        }

        @keyframes bloom4 {
            to { transform: rotate(-10deg) scale(1); }
        }

        @keyframes bloom5 {
            to { transform: rotate(10deg) scale(1); }
        }

        @keyframes bloom6 {
            to { transform: rotate(25deg) scale(1); }
        }

        @keyframes bloom7 {
            to { transform: rotate(45deg) scale(1); }
        }

        @keyframes bloom8 {
            to { transform: rotate(65deg) scale(1); }
        }

        @keyframes inner1 {
            to { transform: rotate(-40deg) scale(1); }
        }

        @keyframes inner2 {
            to { transform: rotate(-20deg) scale(1); }
        }

        @keyframes inner3 {
            to { transform: rotate(20deg) scale(1); }
        }

        @keyframes inner4 {
            to { transform: rotate(40deg) scale(1); }
        }

        @keyframes firstScreenOut {

            0% {
                opacity: 1;
            }

            100% {
                opacity: 0;
                visibility: hidden;
                pointer-events: none;
            }
        }

        @keyframes welcomeShow {

            0% {
                opacity: 0;
                transform: scale(1.04);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* =================================
           MOBILE
        ================================= */

        @media (max-width: 700px) {

            .lotus-area {
                transform: scale(.65);

                gap: -10px;
            }

            .welcome-screen {
                padding:
                    70px 12px
                    60px;
            }

            .welcome-screen h1 {
                font-size: 38px;
            }

            .welcome-screen > p {
                font-size: 16px;
            }

            .video-player {
                padding: 7px;

                border-radius: 12px;
            }

            .video-grid {
                grid-template-columns: 1fr;
            }

            .thumbnail {
                height: 210px;
            }

            .collection h2 {
                font-size: 28px;
            }
        }

    </style>
</head>

<body>

    <!-- =================================
         FIRST ANIMATION
    ================================= -->

    <div class="first-screen">

        <div class="lotus-area">

            <!-- LEFT LOTUS -->

            <div class="lotus">

                <div class="petal p1"></div>
                <div class="petal p2"></div>
                <div class="petal p3"></div>
                <div class="petal p4"></div>
                <div class="petal p5"></div>
                <div class="petal p6"></div>
                <div class="petal p7"></div>
                <div class="petal p8"></div>

                <div class="petal inner i1"></div>
                <div class="petal inner i2"></div>
                <div class="petal inner i3"></div>
                <div class="petal inner i4"></div>

                <div class="center"></div>

            </div>

            <!-- RIGHT LOTUS -->

            <div class="lotus second-lotus">

                <div class="petal p1"></div>
                <div class="petal p2"></div>
                <div class="petal p3"></div>
                <div class="petal p4"></div>
                <div class="petal p5"></div>
                <div class="petal p6"></div>
                <div class="petal p7"></div>
                <div class="petal p8"></div>

                <div class="petal inner i1"></div>
                <div class="petal inner i2"></div>
                <div class="petal inner i3"></div>
                <div class="petal inner i4"></div>

                <div class="center"></div>

            </div>

            <!-- SUN -->

            <div class="sun-area">

                <div class="rays"></div>

                <div class="sun"></div>

            </div>

        </div>

    </div>


    <!-- =================================
         MAIN WEBSITE
    ================================= -->

    <main class="welcome-screen">

        <h1>
            Welcome to My Creative World
        </h1>

        <p>
            Discover something legendary.
        </p>


        <!-- MAIN VIDEO -->

        <div class="video-player">

            <video
                id="mainVideo"
                controls
                playsinline
                poster=""
            >
                <source
                    id="videoSource"
                    src="525099_gif_480.mp4"
                    type="video/mp4"
                >
            </video>

            <div
                class="current-title"
                id="currentTitle"
            >
                Legendary Video 1
            </div>

        </div>


        <!-- COLLECTION -->

        <section class="collection">

            <h2>
                My Legendary Collection
            </h2>

            <div class="video-grid">

                <!-- VIDEO 1 -->

                <div
                    class="video-card active"
                    onclick="selectVideo(
                        '525099_gif_480.mp4',
                        'Legendary Video 1',
                        this
                    )"
                >

                    <div class="thumbnail">
                        ▶
                    </div>

                    <h3>
                        Legendary Video 1
                    </h3>

                </div>


                <!-- VIDEO 2 -->

                <div
                    class="video-card"
                    onclick="selectVideo(
                        'video2.mp4',
                        'Legendary Video 2',
                        this
                    )"
                >

                    <div class="thumbnail">
                        ▶
                    </div>

                    <h3>
                        Legendary Video 2
                    </h3>

                </div>


                <!-- VIDEO 3 -->

                <div
                    class="video-card"
                    onclick="selectVideo(
                        'video3.mp4',
                        'Legendary Video 3',
                        this
                    )"
                >

                    <div class="thumbnail">
                        ▶
                    </div>

                    <h3>
                        Legendary Video 3
                    </h3>

                </div>


                <!-- VIDEO 4 -->

                <div
                    class="video-card"
                    onclick="selectVideo(
                        'video4.mp4',
                        'Legendary Video 4',
                        this
                    )"
                >

                    <div class="thumbnail">
                        ▶
                    </div>

                    <h3>
                        Legendary Video 4
                    </h3>

                </div>


                <!-- VIDEO 5 -->

                <div
                    class="video-card"
                    onclick="selectVideo(
                        'video5.mp4',
                        'Legendary Video 5',
                        this
                    )"
                >

                    <div class="thumbnail">
                        ▶
                    </div>

                    <h3>
                        Legendary Video 5
                    </h3>

                </div>


                <!-- VIDEO 6 -->

                <div
                    class="video-card"
                    onclick="selectVideo(
                        'video6.mp4',
                        'Legendary Video 6',
                        this
                    )"
                >

                    <div class="thumbnail">
                        ▶
                    </div>

                    <h3>
                        Legendary Video 6
                    </h3>

                </div>

            </div>

        </section>

    </main>


    <!-- =================================
         JAVASCRIPT
    ================================= -->

    <script>

        function selectVideo(file, title, card) {

            const video =
                document.getElementById("mainVideo");

            const source =
                document.getElementById("videoSource");

            const titleBox =
                document.getElementById("currentTitle");


            /* Change video */

            source.src = file;

            video.load();

            video.play();


            /* Change title */

            titleBox.textContent = title;


            /* Remove old active */

            document
                .querySelectorAll(".video-card")
                .forEach(function(item) {

                    item.classList.remove("active");

                });


            /* Add active */

            card.classList.add("active");


            /* Scroll to main video */

            document
                .querySelector(".video-player")
                .scrollIntoView({
                    behavior: "smooth",
                    block: "center"
                });

        }

    </script>

</body>
</html>
