<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Periodic Table</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:radial-gradient(
        circle at center,
        #172b3e,
        #080d18 80%
    );
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
}

h1{
    margin:16px 0 4px;
    font-size:27px;
    letter-spacing:3px;
    color:#00eaff;
    text-shadow:0 0 12px #00eaff;
}

.subtitle{
    color:#8299aa;
    font-size:10px;
    letter-spacing:3px;
    margin-bottom:12px;
}

.buttons{
    position:relative;
    z-index:10;
}

button{
    padding:9px 14px;
    margin:3px;
    border:1px solid #00eaff66;
    border-radius:20px;
    background:#142638;
    color:white;
    cursor:pointer;
}

button.active{
    background:#00eaff;
    color:#06111b;
    box-shadow:0 0 10px #00eaff;
}

.scene{
    width:100%;
    height:70vh;

    perspective:1100px;

    display:flex;
    justify-content:center;
    align-items:center;

    overflow:hidden;

    touch-action:none;

    cursor:grab;
}

.scene:active{
    cursor:grabbing;
}

.world{
    position:relative;

    width:1px;
    height:1px;

    transform-style:preserve-3d;

    will-change:transform;
}

.element{
    position:absolute;

    width:42px;
    height:48px;

    border:1px solid currentColor;
    border-radius:8px;

    background:rgba(10,30,50,.9);

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    transform-style:preserve-3d;

    will-change:transform;

    box-shadow:
        0 0 4px currentColor,
        inset 0 0 5px currentColor;

    transition:
        background .2s,
        box-shadow .2s;

    cursor:pointer;
}

.element::before{
    content:"";

    position:absolute;

    inset:3px;

    border:1px solid currentColor;
    border-radius:5px;

    opacity:.3;

    pointer-events:none;
}

.element:hover{
    background:#263d60;

    box-shadow:
        0 0 12px currentColor;

    z-index:100;
}

.symbol{
    font-size:16px;
    font-weight:bold;
}

.name{
    font-size:6px;
    margin-top:2px;
    white-space:nowrap;
}

.number{
    font-size:7px;
    opacity:.8;
}


/* Original colors */

.element:nth-child(4n){
    color:#ff6464;
}

.element:nth-child(4n+1){
    color:#ffd166;
}

.element:nth-child(4n+2){
    color:#06d6a0;
}

.element:nth-child(4n+3){
    color:#4cc9f0;
}


/* Details */

.overlay{
    display:none;

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.85);

    z-index:1000;

    justify-content:center;
    align-items:center;

    padding:20px;
}

.details{
    width:310px;
    max-width:100%;

    padding:25px;

    border:1px solid #00eaff;

    border-radius:18px;

    background:
        linear-gradient(
            145deg,
            #19344b,
            #071321
        );

    box-shadow:
        0 0 25px #00eaff55;

    text-align:left;

    animation:popup .3s ease;
}

@keyframes popup{

    from{
        transform:scale(.7);
        opacity:0;
    }

    to{
        transform:scale(1);
        opacity:1;
    }
}

.details h2{
    color:#00eaff;
    text-align:center;
    margin-top:0;
}

.details p{
    line-height:1.8;
    font-size:14px;
}

.close{
    display:block;

    margin:15px auto 0;

    background:#00eaff;

    color:black;
}

.hint{
    color:#8299aa;

    font-size:10px;

    letter-spacing:1px;
}


/* Mobile */

@media(max-width:600px){

    h1{
        font-size:22px;
        margin-top:12px;
    }

    .subtitle{
        margin-bottom:8px;
    }

    button{
        padding:7px 11px;
        font-size:12px;
    }

    .scene{
        height:68vh;
    }

    .element{
        width:34px;
        height:40px;
    }

    .symbol{
        font-size:13px;
    }

    .name{
        font-size:5px;
    }

    .number{
        font-size:6px;
    }
}
</style>
</head>

<div class="subtitle">
    INTERACTIVE 3D ELEMENTS
</div>


<div class="buttons">

    <button
        class="active"
        onclick="changeMode('table',this)">
        Table
    </button>

    <button
        onclick="changeMode('sphere',this)">
        Sphere
    </button>

    <button
        onclick="changeMode('helix',this)">
        Helix
    </button>

    <button

        Grid

</div>


<div class="scene" id="scene">

    <div class="world" id="world"></div>

</div>


<p class="hint">

</p>


<div class="overlay" id="overlay">

    <div class="details">

        <p id="detailInfo"></p>

        <button

/* =========================================================
   CREATE ELEMENT CARDS
========================================================= */

const world=
document.getElementById("world");

const scene=
document.getElementById("scene");

let cards=[];

    const card=
        document.createElement("div");

    card.className="element";

    card.innerHTML=`

        <div class="number">
            ${element[2]}
        </div>

        <div class="symbol">
            ${element[0]}
        </div>

        <div class="name">
            ${element[1]}
        </div>

    `;

    card.addEventListener("click",()=>{

        showDetails(element);

    });

    world.appendChild(card);

    cards.push(card);

});


/* =========================================================
   TABLE POSITION
========================================================= */

function tablePosition(i){

    const atomic=
        data[i][2];

    /*
       Lanthanides
    */

    if(atomic>=58 && atomic<=71){

        const index=
            atomic-58;

        return{

            x:(index-6.5)*43,

            y:4*54,

            z:0

        };
    }


    /*
       Actinides
    */

    if(atomic>=90 && atomic<=103){

        const index=
            atomic-90;

        return{

            x:(index-6.5)*43,

            y:5*54,

            z:0

        };
    }


    /*
       Main table
    */

    const pos=
        positions[atomic];

    const period=
        pos[0];

    const group=
        pos[1];

    return{

        x:(group-9.5)*43,

        y:(period-4)*54,

        z:0

    };
}


/* =========================================================
   CHANGE MODE
========================================================= */

function changeMode(mode,button){

    document
        .querySelectorAll(".buttons button")
        .forEach(b=>{
            b.classList.remove("active");
        });

    button.classList.add("active");


    const total=
        cards.length;


    cards.forEach((card,i)=>{

        let x=0;
        let y=0;
        let z=0;


        /* TABLE */

        if(mode==="table"){

            const p=
                tablePosition(i);

            x=p.x;
            y=p.y;
            z=p.z;

        }


        /* SPHERE */

        else if(mode==="sphere"){

            const phi=
                Math.acos(
                    1-
                    2*(i+.5)/total
                );

            const theta=
                Math.PI*
                (1+Math.sqrt(5))*i;

            const r=135;

            x=
                r*
                Math.sin(phi)*
                Math.cos(theta);

            y=
                r*
                Math.sin(phi)*
                Math.sin(theta);

            z=
                r*
                Math.cos(phi);

        }


        /* HELIX */

        else if(mode==="helix"){

            const angle=
                i*.36;

            const r=100;

            x=
                r*Math.cos(angle);

            y=
                (i-total/2)*6.5;

            z=
                r*Math.sin(angle);

        }


        /* GRID */

        else if(mode==="grid"){

            const cols=9;

            const col=
                i%cols;

            const row=
                Math.floor(i/cols);

            x=
                (col-4)*48;

            y=
                (row-6)*48;

            z=
                (i%3)*28;

        }


        card.style.transform=
            `translate3d(
                ${x}px,
                ${y}px,
                ${z}px
            )`;

    });

}


/* =========================================================
   DRAG 3D CONTROL
   Drag → Rotate
   Release → Stay there
========================================================= */

let rotateX=0;
let rotateY=0;

let startX=0;
let startY=0;

let startRotateX=0;
let startRotateY=0;

let dragging=false;


/* Pointer down */

scene.addEventListener(
    "pointerdown",
    event=>{

        dragging=true;

        startX=
            event.clientX;

        startY=
            event.clientY;

        startRotateX=
            rotateX;

        startRotateY=
            rotateY;

        scene.setPointerCapture(
            event.pointerId
        );

    }
);


/* Drag */

scene.addEventListener(
    "pointermove",
    event=>{

        if(!dragging)
            return;


        const dx=
            event.clientX-startX;

        const dy=
            event.clientY-startY;


        rotateY=
            startRotateY+
            dx*.35;

        rotateX=
            startRotateX-
            dy*.35;


        world.style.transform=
            `rotateX(${rotateX}deg)
             rotateY(${rotateY}deg)`;

    }
);


/* Release */

scene.addEventListener(
    "pointerup",
    event=>{

        dragging=false;

        try{

            scene.releasePointerCapture(
                event.pointerId
            );

        }catch(e){}

    }
);


/* Touch cancel */

scene.addEventListener(
    "pointercancel",
    ()=>{

        dragging=false;

    }
);


/* =========================================================
   DETAILS
========================================================= */

function showDetails(element){

    document
        .getElementById("detailSymbol")
        .innerText=
            element[0]+
            " - "+
            element[1];


    document
        .getElementById("detailInfo")
        .innerHTML=`

            <b>Atomic Number:</b>
            ${element[2]}
            <br>

            <b>Name:</b>
            ${element[1]}
            <br>

            <b>Symbol:</b>
            ${element[0]}
            <br>

            <b>Atomic Mass:</b>
            ${element[3]} u
            <br>

            <b>Uses:</b>
            ${element[4]}

        `;


    document
        .getElementById("overlay")
        .style.display="flex";
}


function closeDetails(){

    document
        .getElementById("overlay")
        .style.display="none";
}

   START
========================================================= */

    "table",
    document.querySelector(
        ".buttons button"
    )
);


/* Initial 3D angle */

world.style.transform=
    "rotateX(0deg) rotateY(0deg)";

</script>
